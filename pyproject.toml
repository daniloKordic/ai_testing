[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-search-chatgpt"
version = "1.0.0"
description = "ChatGPT-like interface for Azure Search using Azure OpenAI"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "python-dotenv==1.0.0",
    "azure-search-documents==11.4.0",
    "openai==2.32.0",
    "httpx==0.28.1",
    "pydantic==2.13.2",
    "pydantic-settings==2.1.0",
    "aiohttp==3.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "pylint>=2.0.0",
]
